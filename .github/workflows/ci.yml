name: CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90

    env:
      REQUIRED_ANDROID_PLATFORM: "36"
      # Every emulator action below is scoped to this one AVD by name: this runner
      # is a shared desktop where other projects and the developer run emulators too.
      CI_AVD_NAME: CI_Ofuse_Pixel6_API34
      GRADLE_CI_ARGS: "--no-daemon --stacktrace --continue --max-workers=2"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.daemon.jvm.options=-Xmx1024m"

    steps:
      - name: Checkout repository into isolated CI workspace
        uses: actions/checkout@v6
        with:
          path: src
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Self-hosted runner: ~/.gradle already persists on this machine, and
          # it's shared with every other project here. Uploading it to the
          # GitHub Actions cache meant pushing ~17 GB per run, and downloading
          # the same 17 GB back over a local copy that was already there.
          cache-disabled: true

      - name: Verify Android SDK
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_HOME:-}" ]]; then
            for candidate in "$HOME/Library/Android/sdk" "/Users/Shared/Android/sdk"; do
              if [[ -d "$candidate" ]]; then
                ANDROID_HOME="$candidate"
                break
              fi
            done
          fi

          if [[ -z "${ANDROID_HOME:-}" || ! -d "$ANDROID_HOME" ]]; then
            echo "::error::ANDROID_HOME is not set and no Android SDK was found under \$HOME/Library/Android/sdk or /Users/Shared/Android/sdk."
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          if ! compgen -G "$ANDROID_HOME/platforms/android-${REQUIRED_ANDROID_PLATFORM}*" > /dev/null; then
            echo "::error::Missing Android SDK platform android-${REQUIRED_ANDROID_PLATFORM}. Install it for the runner user before rerunning CI."
            exit 1
          fi

      - name: Apply CI-only Gradle resource limits
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          {
            echo ""
            echo "# CI-only overrides appended by .github/workflows/ci.yml"
            echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"
            echo "org.gradle.workers.max=2"
            echo "org.gradle.parallel=false"
          } >> gradle.properties

      - name: Build and test with Gradle
        working-directory: src
        shell: bash
        run: ./gradlew $GRADLE_CI_ARGS assembleDebug check

      - name: Ensure Maestro CLI is available
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$HOME/.maestro/bin/maestro" ]]; then
            curl -Ls "https://get.maestro.mobile.dev" | bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Clean up a stray CI emulator from previous runs
        shell: bash
        run: |
          set +e
          ADB="$ANDROID_HOME/platform-tools/adb"

          # Only ever kills $CI_AVD_NAME. This used to `emu kill` every attached
          # emulator, `adb kill-server`, and `pkill -f qemu-system` -- which on a
          # shared machine tears down whatever else happens to be running, and
          # killing the adb server breaks other sessions' connections too.
          if [[ -x "$ADB" ]]; then
            for serial in $("$ADB" devices | awk '/^emulator-/{print $1}'); do
              avd=$("$ADB" -s "$serial" emu avd name 2>/dev/null | head -1 | tr -d '\r')
              if [[ "$avd" == "$CI_AVD_NAME" ]]; then
                echo "Killing stray $CI_AVD_NAME on $serial"
                "$ADB" -s "$serial" emu kill
              else
                echo "Leaving $serial alone (AVD: ${avd:-unknown})"
              fi
            done
          fi

          # Backstop for an instance whose console no longer answers `emu kill`.
          # Matches the `-avd <name>` argument on the qemu command line, so it
          # is still scoped to this AVD.
          pkill -f "avd $CI_AVD_NAME" || true
          exit 0

      - name: Boot CI Android emulator
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$CI_AVD_NAME" \
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect \
            > "/tmp/emulator-$CI_AVD_NAME.log" 2>&1 &

          # Match on the AVD name rather than taking the first emulator in the
          # list. Now that the cleanup above leaves other projects' emulators
          # running, "the first one" is frequently somebody else's -- which is
          # how a previous run executed the whole suite on a Pixel_9 that this
          # workflow never booted. AGP's device provider honours ANDROID_SERIAL,
          # so getting this right is also what pins the tests to our emulator.
          serial=""
          deadline=$((SECONDS + 300))
          until [[ -n "$serial" ]]; do
            for candidate in $("$adb" devices | awk '/^emulator-/{print $1}'); do
              avd=$("$adb" -s "$candidate" emu avd name 2>/dev/null | head -1 | tr -d '\r')
              if [[ "$avd" == "$CI_AVD_NAME" ]]; then
                serial="$candidate"
                break
              fi
            done
            if [[ -z "$serial" && $SECONDS -ge $deadline ]]; then
              echo "::error::$CI_AVD_NAME did not appear within 300s. See /tmp/emulator-$CI_AVD_NAME.log"
              exit 1
            fi
            sleep 2
          done
          echo "Using $serial for $CI_AVD_NAME"
          echo "ANDROID_SERIAL=$serial" >> "$GITHUB_ENV"

          "$adb" -s "$serial" wait-for-device
          boot_completed=""
          until [[ "$boot_completed" == "1" ]]; do
            boot_completed=$("$adb" -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            sleep 2
          done

      - name: Keep the CI emulator awake and unlocked
        shell: bash
        run: |
          set -uo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"

          # A sleeping or locked emulator does not resume the Compose test host
          # activity, and every test that runs while it is out dies with
          # "IllegalStateException: No compose hierarchies found in the app" --
          # a different, random handful each run, which reads like flaky tests
          # rather than a flaky device. Seen failing a docs-only commit that
          # changed no code at all.
          #
          # Each command is individually non-fatal: this is device hygiene, not
          # a test, and an image without `wm dismiss-keyguard` shouldn't fail
          # the build.
          echo "Keeping $ANDROID_SERIAL ($CI_AVD_NAME) awake"
          "$adb" -s "$ANDROID_SERIAL" shell svc power stayon true || true
          "$adb" -s "$ANDROID_SERIAL" shell input keyevent KEYCODE_WAKEUP || true
          "$adb" -s "$ANDROID_SERIAL" shell wm dismiss-keyguard || true
          "$adb" -s "$ANDROID_SERIAL" shell settings put system screen_off_timeout 1800000 || true

      - name: Run instrumented tests
        working-directory: src
        shell: bash
        run: ./gradlew $GRADLE_CI_ARGS connectedDebugAndroidTest

      - name: Install debug APK for Maestro
        working-directory: src
        shell: bash
        env:
          APP_MODULE: sample
        run: |
          set -euo pipefail
          apk_path=$(find "$APP_MODULE/build/outputs/apk/debug" -name "*.apk" | head -n1)
          if [[ -z "$apk_path" ]]; then
            echo "::error::No debug APK found under $APP_MODULE/build/outputs/apk/debug"
            exit 1
          fi
          "$ANDROID_HOME/platform-tools/adb" install -r "$apk_path"

      - name: Run Maestro e2e flows
        working-directory: src
        shell: bash
        # Maestro ignores ANDROID_SERIAL and picks the first attached device,
        # which on this shared machine can be a developer's emulator rather
        # than the CI AVD -- pin it explicitly.
        run: maestro --device "$ANDROID_SERIAL" test maestro/

      - name: Shut down CI emulator
        if: always()
        shell: bash
        run: |
          set +e
          ADB="$ANDROID_HOME/platform-tools/adb"

          # Same rule as the cleanup step: this job shuts down its own emulator
          # and nothing else on the machine.
          for serial in $("$ADB" devices | awk '/^emulator-/{print $1}'); do
            avd=$("$ADB" -s "$serial" emu avd name 2>/dev/null | head -1 | tr -d '\r')
            if [[ "$avd" == "$CI_AVD_NAME" ]]; then
              echo "Shutting down $CI_AVD_NAME on $serial"
              "$ADB" -s "$serial" emu kill
            fi
          done
          exit 0
