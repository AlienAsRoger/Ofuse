name: CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90

    env:
      REQUIRED_ANDROID_PLATFORM: "36"
      GRADLE_CI_ARGS: "--no-daemon --stacktrace --continue --max-workers=2"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.daemon.jvm.options=-Xmx1024m"

    steps:
      - name: Checkout repository into isolated CI workspace
        uses: actions/checkout@v6
        with:
          path: src
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Self-hosted runner: ~/.gradle already persists on this machine, and
          # it's shared with every other project here. Uploading it to the
          # GitHub Actions cache meant pushing ~17 GB per run, and downloading
          # the same 17 GB back over a local copy that was already there.
          cache-disabled: true

      - name: Verify Android SDK
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_HOME:-}" ]]; then
            for candidate in "$HOME/Library/Android/sdk" "/Users/Shared/Android/sdk"; do
              if [[ -d "$candidate" ]]; then
                ANDROID_HOME="$candidate"
                break
              fi
            done
          fi

          if [[ -z "${ANDROID_HOME:-}" || ! -d "$ANDROID_HOME" ]]; then
            echo "::error::ANDROID_HOME is not set and no Android SDK was found under \$HOME/Library/Android/sdk or /Users/Shared/Android/sdk."
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          if ! compgen -G "$ANDROID_HOME/platforms/android-${REQUIRED_ANDROID_PLATFORM}*" > /dev/null; then
            echo "::error::Missing Android SDK platform android-${REQUIRED_ANDROID_PLATFORM}. Install it for the runner user before rerunning CI."
            exit 1
          fi

      - name: Apply CI-only Gradle resource limits
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          {
            echo ""
            echo "# CI-only overrides appended by .github/workflows/ci.yml"
            echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"
            echo "org.gradle.workers.max=2"
            echo "org.gradle.parallel=false"
          } >> gradle.properties

      - name: Build and test with Gradle
        working-directory: src
        shell: bash
        run: ./gradlew $GRADLE_CI_ARGS assembleDebug check

      - name: Ensure Maestro CLI is available
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$HOME/.maestro/bin/maestro" ]]; then
            curl -Ls "https://get.maestro.mobile.dev" | bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Lease an emulator from the shared queue
        shell: bash
        # This Mac runs every repo's CI runner and local agents. emu-queue
        # (~/.emu-queue/README.md) gives this job one emulator to itself: it waits
        # in line, boots the AVD headless if needed, and writes EMU_LEASE, EMU_AVD
        # and ANDROID_SERIAL (honoured by adb and AGP) to $GITHUB_ENV.
        run: |
          "$HOME/.emu-queue/emu-queue" acquire --project Ofuse --ttl 100 --wait 45 \
            --label "CI run ${{ github.run_id }}" --env-file "$GITHUB_ENV"

      - name: Keep the CI emulator awake and unlocked
        shell: bash
        run: |
          set -uo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"

          # A sleeping or locked emulator does not resume the Compose test host
          # activity, and every test that runs while it is out dies with
          # "IllegalStateException: No compose hierarchies found in the app" --
          # a different, random handful each run, which reads like flaky tests
          # rather than a flaky device. Seen failing a docs-only commit that
          # changed no code at all.
          #
          # Each command is individually non-fatal: this is device hygiene, not
          # a test, and an image without `wm dismiss-keyguard` shouldn't fail
          # the build.
          echo "Keeping $ANDROID_SERIAL ($EMU_AVD) awake"
          "$adb" -s "$ANDROID_SERIAL" shell svc power stayon true || true
          "$adb" -s "$ANDROID_SERIAL" shell input keyevent KEYCODE_WAKEUP || true
          "$adb" -s "$ANDROID_SERIAL" shell wm dismiss-keyguard || true
          "$adb" -s "$ANDROID_SERIAL" shell settings put system screen_off_timeout 1800000 || true

      - name: Run instrumented tests
        working-directory: src
        shell: bash
        run: ./gradlew $GRADLE_CI_ARGS connectedDebugAndroidTest

      - name: Install debug APK for Maestro
        working-directory: src
        shell: bash
        env:
          APP_MODULE: sample
        run: |
          set -euo pipefail
          apk_path=$(find "$APP_MODULE/build/outputs/apk/debug" -name "*.apk" | head -n1)
          if [[ -z "$apk_path" ]]; then
            echo "::error::No debug APK found under $APP_MODULE/build/outputs/apk/debug"
            exit 1
          fi
          "$ANDROID_HOME/platform-tools/adb" install -r "$apk_path"

      - name: Run Maestro e2e flows
        working-directory: src
        shell: bash
        # Maestro ignores ANDROID_SERIAL and picks the first attached device,
        # which on this shared machine can be a developer's emulator rather
        # than the CI AVD -- pin it explicitly.
        run: maestro --device "$ANDROID_SERIAL" test maestro/

      - name: Release the emulator lease
        if: always()
        shell: bash
        # Stops the emulator only if this job booted it. A cancelled job's lease
        # ends on its own once its Runner.Worker exits.
        run: |
          if [[ -n "${EMU_LEASE:-}" ]]; then
            "$HOME/.emu-queue/emu-queue" release "$EMU_LEASE" --shutdown
          fi
